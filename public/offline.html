<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Tidy Mimo</title>
  <link rel="icon" href="/favicon-32x32.png" />
  <style>
    :root {
      --bg-main: #FCE8F4;
      --primary-pink: #D41479;
      --primary-purple: #6C2A79;
      --text-primary: #1A0A1D;
      --text-secondary: rgba(26, 10, 29, 0.7);
      --font-inter: 'Inter', system-ui, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-inter);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo-container {
      margin-bottom: 2rem;
    }
    .logo-container img {
      width: 150px;
      height: auto;
      /* Advanced grayscale implementation from prompt requirements */
      filter: grayscale(100%) brightness(0.6);
      opacity: 0.8;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-secondary);
      font-size: 1.15rem;
      margin: 0 0 2.5rem;
      max-width: 400px;
      line-height: 1.6;
    }
    .btn-retry {
      background: var(--primary-pink);
      color: white;
      border: none;
      padding: 1rem 2.8rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-retry:hover {
      background: var(--primary-purple);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 20, 121, 0.25);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/assets/LogoNoBg.png" alt="Tidy Mimo">
  </div>
  <h1>You're offline</h1>
  <p>Check your connection and try again.</p>
  <button class="btn-retry" onclick="window.location.reload()">Try Again</button>

  <script>
    // UX Enhancement: Smooth reload trigger upon connection restoration
    window.addEventListener('online', () => {
      document.querySelector('h1').innerText = "Back Online!";
      document.querySelector('p').innerText = "Reconnecting to Tidy Mimo...";
      document.querySelector('img').style.filter = "grayscale(0%) brightness(1)";
      document.querySelector('img').style.opacity = "1";
      document.querySelector('.btn-retry').style.display = "none";
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });
  </script>
</body>
</html>
